<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <title>Retro Frisbee</title>
  <meta name="theme-color" content="#2f9e44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="img/icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Frisbee">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/manager.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/manager_renderer.js"></script>
  <script src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
